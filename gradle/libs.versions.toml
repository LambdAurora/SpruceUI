[versions]
minecraft = "1.21.8"
fabric-loader = "0.16.14"
neoforge-loader = "7.0.11"
fabric-api = "0.130.0+1.21.8"
mappings-yalmm = "3"
modmenu="15.0.0-beta.1"

yumi-commons = "1.0.0-beta.1"
yumi-mc-foundation = "1.0.0-alpha.7+1.21.1"

# Gradle
gradle-licenser = "2.1.+"
gradle-loom = "1.11.+"
gradle-lambdamcdev = "1.3.+"

[libraries]
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
neoforge-loader = { module = "net.neoforged.fancymodloader:loader", version.ref = "neoforge-loader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }
modmenu = { module = "com.terraformersmc:modmenu", version.ref = "modmenu" }

# Dependencies
yumi-commons = { module = "dev.yumi.commons:yumi-commons", version.ref = "yumi-commons" }
yumi-mc-foundation = { module = "dev.yumi.mc.core:yumi-mc-foundation", version.ref = "yumi-mc-foundation" }

# Gradle
gradle-licenser = { module = "dev.yumi:yumi-gradle-licenser", version.ref = "gradle-licenser" }
gradle-loom = { module = "net.fabricmc:fabric-loom", version.ref = "gradle-loom" }
gradle-lambdamcdev = { module = "dev.lambdaurora.mcdev:dev.lambdaurora.mcdev.gradle.plugin", version.ref = "gradle-lambdamcdev" }
